schema_version = 5
template = false
profile = "stateful"
owner = "AIBackman maintainers"
expected_failure_modes = [
  "renderer or hidden bridge hangs while the main archive UI remains responsive",
  "database worker stalls, exits, or returns malformed search output",
  "archive import or cache refresh loses, overwrites, or partially publishes messages",
  "migration, recovery, or account-store corruption prevents startup",
  "diagnostic capture itself leaks credentials or changes production timing",
]

[architecture]
state_owners = ["React workspace state owns presentation selection; ChatDatabase owns durable archive state; provider bridges own live-site state; diagnostic runtime owns bounded evidence state."]
mutation_points = ["ChatDatabase.runArchiveOperation is the guarded durable mutation boundary; a private in-process capability and connection-scoped SQLite functions prevent callers from self-authorizing writes; provider writers enter through the standard archive writer."]
side_effect_boundaries = ["Electron main process, provider bridge windows, database worker process, filesystem archive/audit/recovery paths, and renderer IPC are separate boundaries."]
fault_containment = "The diagnostic supervisor and SQLite recovery snapshots are outside the renderer and bounded event writer; optional diagnostic failure is non-fatal, while required archive-audit failure refuses the mutation."

[errors]
typed_codes = "implemented_untested"
preserves_source_chain = "implemented_tested"
preserves_first_failure = "implemented_untested"
causal_ids = ["operation_id", "task_id", "worker_instance_id", "database_instance_id", "store_generation", "diagnostic sequence"]

[invariants]
release_checks = ["non-destructive archive operations cannot reduce conversation or message counts", "unguarded message/conversation deletion is rejected", "non-empty message content cannot become empty accidentally", "audit and recovery tables are append-only/immutable", "an existing database missing either content table is snapshotted and refused rather than silently recreated", "missing safety triggers are snapshotted before repair"]
progress_rules = ["database worker requests have a 30-second timeout and completion/cancellation accounting", "bridge generation polling has a bounded timeout", "diagnostic event rings and supervisor responses have fixed limits"]
resource_balances = ["worker tasks close on success, timeout, worker exit, and stop", "diagnostic supervisor and heartbeat timers are stopped during normal quit", "database recovery snapshots are validated before publication"]

[configuration]
effective_config = "implemented_untested"
decision_provenance = "implemented_untested"
dynamic_change_history = "implemented_untested"

[build]
identity = "dist/build-info.json contains a schema, deterministic source/git/package identity, mode, platform, artifact digest, and build_id; runtime snapshots and events carry that build_id."
exact_artifact_retention = "implemented_untested"
symbols_and_unwind = "implemented_untested"
source_retrieval = "implemented_untested"

[artifacts]
cache_identity = "implemented_untested"
atomic_publication = "implemented_untested"
generation_manifest = "implemented_untested"

[live]
capabilities_command = "npm run diagnose -- capabilities (or node scripts/aibackman-diagnose.cjs capabilities)"
snapshot_command = "npm run diagnose -- snapshot"
snapshot_consistency = "best-effort"
independent_of_failure_loop = "implemented_tested"
capture_timeout_ms = 2000

[history]
flight_recorder = "implemented_tested"
schema = "aibackman-diagnostic-event-v1; bounded local ring plus bounded JSONL session file with sequence, monotonic time, causal IDs, build identity, redaction, and drop accounting."
capacity_events = 1000
drop_and_overwrite_reporting = "implemented_tested"

[audit_trail]
mutation_audit = "implemented_tested"
event_schema = "aibackman-audit-event-v1; SQLite audit rows and a separately recorded hash-chained JSONL mutation journal."
actor_writer_and_reason = "Every guarded operation records actor, writer component/instance, bounded reason and reason code; actor trust is explicit and caller metadata is not treated as a writer identity."
attribution_policy = "Archive content, guard context, audit, recovery, and store-identity writes from unguarded SQLite connections are rejected. API operations record asserted in-process actor and writer metadata without claiming authenticated human identity."
transaction_binding = "The operation_id is the transaction_id and is written by the same SQLite transaction as the operation-completed audit row; store_instance_id and store_generation bind the record to one database lineage."
attempted_write_policy = "operation-started and operation-failed are retained in the durable journal; committed versus failed outcome is explicit and a pre-commit audit-journal failure refuses the mutation."
provenance_and_deduplication = "Source fingerprints are written through the guarded source-item operation; operation IDs and event IDs distinguish retries without silently deduplicating a repeated attempt."
change_representation = "Message audit values are bounded typed summaries with lengths and SHA-256 hashes, never message bodies; immutable recovery records retain exact deleted rows and prior message, conversation, and source-item revisions for explicit restoration."
direct_write_coverage = "implemented_tested"
tamper_evidence = "The external journal uses a bounded append-only file, fsync, exclusive lock, sequence, previous-hash/hash chain, automatic startup/pre-append integrity verification, and restrictive directory/file permissions. This detects accidental/local rewriting but is not an external trust anchor against an administrator who can rewrite the entire chain."
retention_and_access = "Recovery records and verified database snapshots are retained until explicit maintenance; the audit journal is never silently rotated and fails closed at its configured byte budget. Private diagnostics are pruned after 7 days and capped at 64 MiB across sessions."
query_and_export = "ChatDatabase.getAuditTrail/getRecoveryRecords expose bounded queries; the diagnose CLI exposes only bounded redacted diagnostic control-plane data, not raw archive content."
sink_failure_policy = "The SQLite audit row is authoritative and transactional; the external journal is supplemental after commit, but startup/operation start and size/integrity failures are surfaced and mutation refusal is used where evidence would otherwise be absent."
cost_and_backpressure = "Audit event size is capped at 65536 bytes, journal storage at 256 MiB by default, lock acquisition at 2 seconds, and diagnostic events use asynchronous bounded queues. The regression benchmark separately gates a 200-message guarded transaction and optional diagnostic calls."
assurance_test = "scripts/test-archive-safety.cjs covers rollback guards, direct-write rejection, message insert/update/delete provenance, snapshots, restore, journal chaining, and append-only enforcement."
max_event_bytes = 65536
max_added_commit_p99_ms = 200.0
max_throughput_regression_percent = 5000.0
max_audit_wait_ms = 2000
max_storage_bytes_per_day = 268435456

[concurrency]
task_registry = "implemented_tested"
lock_wait_introspection = "implemented_untested"
cross_process_correlation = "implemented_tested"

[resources]
ownership_reporting = "implemented_tested"
declared_budgets = ["diagnostic ring: 1000 events", "diagnostic file: 16 MiB per session", "diagnostic total: 64 MiB and 7 days", "diagnostic snapshot: 768 KiB", "diagnostic activation: at most 5 minutes", "supervisor ring: 2000 events", "diagnostic response: 1 MiB", "audit journal: 256 MiB default", "audit event: 64 KiB"]
high_water_reporting = "implemented_untested"

[reproduction]
recorded_inputs = ["build mode, source/git/package identity, platform/runtime versions, operation/task/worker/store IDs, bounded configuration and safe input lengths"]
replay_command = "npm run diagnose -- snapshot; reproduce the operation with the recorded build-info.json and archive-safety test fixtures"
fault_injection = ["abrupt parent-process exit", "diagnostic supervisor disconnect", "database worker timeout/exit", "audit journal size exhaustion", "redaction and oversized event tests"]

[postmortem]
crash_capture = "implemented_untested"
includes_history = "implemented_tested"
oom_or_external_kill_detection = "implemented_untested"
retention_policy = "Private session diagnostics and crash dumps are pruned after 7 days and bounded to 64 MiB in total; archive recovery snapshots are not automatically deleted."

[recovery]
pre_repair_evidence = "implemented_tested"
restart_or_fallback_history = "implemented_tested"
last_failure_retention = "implemented_tested"

[domain]
state_dump = "The diagnostic snapshot reports process state, generation, heartbeat, bounded task/resource registries, event drop counts, recent semantic events, database/store identity, and supervisor status."
cross_boundary_ids = ["session_id", "process_instance_id", "operation_id", "parent_operation_id", "task_id", "worker_instance_id", "request_id", "database_instance_id", "store_generation"]

[security]
authorization = "The diagnostic control plane is a private Unix socket in a 0700 directory with a random 256-bit token in a 0600 file; no public debugger port is enabled by default."
redaction = ["credential-shaped keys are replaced", "Bearer/API-key-shaped strings are redacted", "strings and collections are bounded", "raw chat/message payloads are excluded from diagnostic events"]
max_bundle_bytes = 16777216
retention_days = 7

[budgets]
measurement_status = "implemented_tested"
steady_cpu_percent = 0.5
steady_memory_bytes = 8388608
activated_cpu_percent = 10.0

[deployment_modes]
minimal_release = "release-minimal: optional diagnostic runtime is not started; normal build has no source maps and no diagnostic helper. Durable archive auditing remains enabled."
observable_release = "release-observable: same optimized build with AIBACKMAN_DIAGNOSTICS=1 enables bounded redacted evidence; bridge remains hidden unless explicitly requested."
global_runtime_switch = "AIBACKMAN_DIAGNOSTICS=1 plus AIBACKMAN_DIAGNOSTIC_MODE; AIBACKMAN_DEBUG_DIR selects the private evidence directory."
per_category_switches = ["AIBACKMAN_TRACE_GC", "AIBACKMAN_VERBOSE_LOGGING", "AIBACKMAN_OPEN_DEVTOOLS", "AIBACKMAN_REMOTE_DEBUG", "AIBACKMAN_CHROMIUM_LOGGING", "AIBACKMAN_BRIDGE_VISIBLE", "AIBACKMAN_BRIDGE_FAST_MODE"]
diagnostic_builds = ["npm run build:debug", "npm run electron:release:debug", "npm run electron:release:debug:bridge"]
optional_diagnostics_default_enabled = false
lazy_buffer_allocation = true
lazy_helper_start = true

[performance_isolation]
preserves_release_optimization = true
compile_time_exclusion_supported = false
critical_hot_paths = ["archive reads and message presentation", "SQLite import transaction", "provider bridge message capture"]
disabled_hot_path_extra_instructions = 0
baseline_comparison = "scripts/test-debuggability-performance.cjs measures the inactive call path, activated recorder and snapshot latency, and always-on archive safety against an equivalent raw SQLite batch. The raw baseline makes the relative audit percentage deliberately conservative; absolute protected cost is also gated."
minimal_mode_test = "scripts/test-diagnostics.cjs proves the inactive runtime creates no identifiers, directories, buffers, or helper; scripts/test-debuggability-performance.cjs gates the no-op call average."
runtime_disabled_test = "scripts/test-debuggability-performance.cjs executes 250000 disabled calls and enforces a 0.002 ms average ceiling without filesystem creation."
always_on_test = "scripts/test-debuggability-performance.cjs compares one hundred 200-message guarded transactions with equivalent raw SQLite transactions and enforces the declared p99/throughput ceilings; the safety suite verifies evidence fidelity."
activated_mode_tests = ["scripts/test-diagnostics.cjs verifies supervisor control, concurrent sessions, TTL, retention, ring/drop bounds, redaction, and awaited shutdown", "scripts/test-debuggability-performance.cjs gates activated record p99 and bounded snapshot latency", "manual release-debug execution remains necessary for Electron crash/symbol paths"]

[instrumentation_policy]
facility_admission = "required"
default_class = "activated"
max_steady_cpu_percent = 0.5
max_steady_memory_bytes = 8388608
max_event_rate_per_second = 1000
max_disk_bytes_per_day = 134217728
max_snapshot_pause_ms = 100
max_activation_ttl_seconds = 300
max_activated_capture_bytes = 67108864
max_minimal_cpu_regression_percent = 0.0
max_runtime_disabled_cpu_regression_percent = 0.1
max_steady_p99_latency_regression_percent = 1.0
max_activated_cpu_percent = 10.0
synchronous_hot_path_io = false
global_contended_event_index = false
require_overhead_test = true
promotion_requires_measurement = true

[assurance]
contract_test = "npm run validate:debuggability"
synthetic_scenarios = ["abrupt parent-process exit with independently retained evidence", "bounded event overflow", "redaction", "supervisor control while the parent is busy", "worker timeout/exit", "audit journal integrity and budget refusal"]
symbolization_test = "npm run build:debug and Electron --inspect=9229 are documented; exact release artifact symbol retention remains untested."
redaction_test = "scripts/test-diagnostics.cjs asserts credential-shaped keys and values never appear in persisted event output."
overhead_test = "npm run test:debuggability:performance measures and gates inactive, activated, snapshot, and always-on archive-audit costs on every run."
snapshot_test = "scripts/test-diagnostics.cjs queries the independent Unix-socket control plane and checks the snapshot schema/identity."

[exceptions]
items = []

