name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:debuggability
      - run: npm run lint
      - run: npm run test:highlight
      - run: npm run test:diagnostics
      - run: npm run test:archive
      - run: npm run test:debuggability:performance
      - run: npm run build
