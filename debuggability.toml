"architecture.mutation_points" = { status = "implemented_tested", reason = "Durable writes must pass the guarded archive API or SQLite trigger coverage.", implementation = "ChatDatabase.runArchiveOperation and archive safety triggers.", test = "scripts/test-archive-safety.cjs rejects unguarded delete and replacement writes." }
